    <script>
      // Gracefully suppress benign sandbox dev server WebSocket disconnect alerts
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e && (e.reason || e);
        var msg = (typeof reason === 'string' ? reason : (reason && reason.message) || '') + '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('vite') !== -1) {
          e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function (e) {
        var msg = (e && e.message) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('vite') !== -1) {
          e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
        }
      }, true);
    </script>
